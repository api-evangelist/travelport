  - aid: travelport:trip-services-pay
    name: Travelport TripServices Pay API
    description: 'RESTful JSON payments API enabling online travel agencies to perform credit card authorizations, address validations, 3D Secure transactions, and reversals against designated merchant vendors. Current version 11.33.0.'
