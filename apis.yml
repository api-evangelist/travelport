apis:
  - aid: travelport:trip-services-flights
    name: Travelport TripServices Flights API
    description: 'RESTful JSON API providing end-to-end air travel workflows including search, price, book, ticket, cancel, and exchange. Covers both GDS and NDC content from 400+ airlines and low-cost carriers, with workbench-based or single-payload booking flows.'
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://developer.travelport.com/apis/flights
    baseURL: https://api.travelport.net/11
