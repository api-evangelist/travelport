  - aid: travelport:trip-services-stays
    name: Travelport TripServices Stays API
    description: 'RESTful JSON API for hotel search, availability, rules, reservation management, and modification across 180+ countries. Supports searches by coordinates, address, airport/city code, or property ID, plus passive-segment bookings for external suppliers.'
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
